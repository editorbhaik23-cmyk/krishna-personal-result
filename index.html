<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Krishna Personal MP Result Check</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(to right, #667eea, #764ba2);
    }

    .container {
      max-width: 420px;
      margin: 30px auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      font-size: 22px;
      color: #333;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #555;
      margin-bottom: 20px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      display: block;
      margin-top: 12px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .dob {
      display: flex;
      gap: 6px;
    }

    .dob select {
      width: 33%;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #5563d6;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 12px;
      background: #f1f5ff;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
      color: #333;
    }

    .note {
      text-align: center;
      font-size: 12px;
      color: #444;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Krishna Personal MP Result Check</h1>
  <div class="subtitle">
    West Bengal Board – Dhanyashree Centre
  </div>

  <label>Roll Number</label>
  <input type="text" id="roll" placeholder="Enter Roll Number">

  <label>Date of Birth</label>
  <div class="dob">
    <select id="day">
      <option>Date</option>
      <!-- 1 to 31 -->
      <script>
        for(let i=1;i<=31;i++){
          document.write(`<option>${i}</option>`);
        }
      </script>
    </select>

    <select id="month">
      <option>Month</option>
      <option>Jan</option><option>Feb</option><option>Mar</option>
      <option>Apr</option><option>May</option><option>Jun</option>
      <option>Jul</option><option>Aug</option><option>Sep</option>
      <option>Oct</option><option>Nov</option><option>Dec</option>
    </select>

    <select id="year">
      <option>Year</option>
      <script>
        for(let y=2010;y>=1990;y--){
          document.write(`<option>${y}</option>`);
        }
      </script>
    </select>
  </div>

  <button onclick="showResult()">View Result</button>

  <div class="result" id="resultBox">
    ✅ <b>Result Found</b><br><br>
    Bengali, English, Mathematics, Physical Science,<br>
    Life Science, History, Geography<br><br>
    <b>Status:</b> PASS
  </div>

  <div class="note">
    Note: Online link private রাখা হয়েছে।
  </div>

</div>

<script>
  function showResult() {
    var roll = document.getElementById("roll").value;
    if (roll === "") {
      alert("Please enter Roll Number");
    } else {
      document.getElementById("resultBox").style.display = "block";
    }
  }
</script>

</body>
    </html>
